<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spider &amp; Bat Logo</title>
<style>
:root{--bg:#ffffff;--ink:#000000;--muted:#6b6b72;--accent:#000000;--panel:#ffffffcc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;box-sizing:border-box}
#logo{position:relative;transform-style:preserve-3d;will-change:transform;width:min(80vw,520px);aspect-ratio:2350/765;border:0;background:transparent;padding:0;cursor:pointer}
#logo img{width:100%;height:100%;display:block;object-fit:contain}
h1{margin:0;font-size:20px;font-weight:400}
body{transition:background .35s}
#c2{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.bar{align-items:center}
.bar button.sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #000;backdrop-filter:none}
.bar button.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #000}
@media (max-width:600px){#logo{width:56vw}}
.hint{position:fixed;z-index:3;top:0;left:0;right:0;text-align:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 0;font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;letter-spacing:.08em;pointer-events:none}
.bar{position:fixed;z-index:3;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.bar button{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;padding:9px 14px;border-radius:999px;border:1px solid #000;background:#000;color:#fff;cursor:pointer;backdrop-filter:blur(6px)}
.bar button:not(.sw):hover{background:#262626;border-color:#262626;color:#fff}
</style>
</head>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

const logo=document.getElementById('logo');
let pointer={x:W/2,y:H/2,t:-1e9};
addEventListener('pointermove',e=>{pointer={x:e.clientX,y:e.clientY,t:performance.now()}});

const rnd=(a,b)=>a+Math.random()*(b-a);
const ang=(a)=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const spiders=[];
let mode='spider';

class Spider{
  constructor(x,y){
    this.x=x;this.y=y;this.base=rnd(8,19)*(W<600?0.6:1);this.born=performance.now();
    this.pairs=[3,4,4,5][Math.floor(Math.random()*4)];
    this.h=rnd(0,Math.PI*2);this.speed=rnd(70,130)*(W<600?0.65:1);this.wander=null;this.stepping=[false,false];
    this.hue=Math.random();this.legs=[];
    this.size=1;
    for(let k=0;k<this.pairs;k++)for(const s of [-1,1])this.legs.push({k,s,fx:x,fy:y,sx:x,sy:y,ex:x,ey:y,t:1,on:false,g:(k+(s>0?1:0))%2});
    // start pointing away from logo toward screen center
    this.h=Math.atan2(H/2+rnd(-200,200)-y,W/2+rnd(-200,200)-x)+(Math.random()<.5?1:-1)*rnd(.5,1.4);
  }
  dir(a){return[Math.cos(a),Math.sin(a)]}
  update(dt,now){
    const age=(now-this.born)/1000,grow=Math.max(0,Math.min(1,age/0.5));
    this.size=this.base*(1-Math.pow(1-grow,3));
    const s=this.size;
    // target selection
    let tx,ty;
    {
      if(!this.wander||Math.hypot(this.wander.x-this.x,this.wander.y-this.y)<40)this.wander={x:rnd(40,W-40),y:rnd(40,H-40)};
      tx=this.wander.x;ty=this.wander.y;
    }
    const dx=tx-this.x,dy=ty-this.y,d=Math.hypot(dx,dy);
    const want=Math.atan2(dy,dx);
    this.h+=ang(want-this.h)*Math.min(1,dt*3.2);
    const boost=1+3.5*Math.max(0,1-age/0.9);
    const sp=this.speed*boost*Math.min(1,d/90)*Math.min(1,grow*3);
    this.vx=Math.cos(this.h)*sp;this.vy=Math.sin(this.h)*sp;
    this.x+=this.vx*dt;this.y+=this.vy*dt;
    // legs
    const reach=s*1.9,n=this.pairs;
    const anyStep=[false,false];
    for(const L of this.legs)if(L.on)anyStep[L.g]=true;
    for(const L of this.legs){
      const rel=L.s*(Math.PI/2+(L.k-(n-1)/2)*0.42);
      const [ux,uy]=this.dir(this.h+rel);
      L.rx=this.x+ux*reach*0.9+this.vx*0.12;L.ry=this.y+uy*reach*0.9+this.vy*0.12;
      L.hx=this.x+ux*s*0.35;L.hy=this.y+uy*s*0.35;
      if(L.on){
        L.t+=dt/0.16;
        const e=L.t>=1?1:1-Math.pow(1-L.t,2);
        L.fx=L.sx+(L.ex-L.sx)*e;L.fy=L.sy+(L.ey-L.sy)*e;
        if(L.t>=1)L.on=false;
      }else{
        const off=Math.hypot(L.fx-L.rx,L.fy-L.ry);
        if(off>reach*0.5&&!anyStep[1-L.g]){
          L.on=true;L.t=0;L.sx=L.fx;L.sy=L.fy;L.ex=L.rx+this.vx*0.1;L.ey=L.ry+this.vy*0.1;anyStep[L.g]=true;
        }
        if(off>reach*2.4){L.fx=L.rx;L.fy=L.ry}
      }
    }
  }
  draw(ink,c=ctx){
    const s=this.size;if(s<0.5)return;
    const reach=s*1.9,l1=reach*0.62,l2=reach*0.7;
    c.strokeStyle=ink;c.fillStyle=ink;c.lineCap='round';c.lineJoin='round';
    for(const L of this.legs){
      let ddx=L.fx-L.hx,ddy=L.fy-L.hy,d=Math.hypot(ddx,ddy)||1;
      const dd=Math.min(d,l1+l2-0.01);
      const a=(l1*l1-l2*l2+dd*dd)/(2*dd),hh=Math.sqrt(Math.max(0,l1*l1-a*a));
      const nx=ddx/d,ny=ddy/d;
      let kx=L.hx+nx*a-ny*hh,ky=L.hy+ny*a+nx*hh;
      const k2x=L.hx+nx*a+ny*hh,k2y=L.hy+ny*a-nx*hh;
      if(Math.hypot(k2x-this.x,k2y-this.y)>Math.hypot(kx-this.x,ky-this.y)){kx=k2x;ky=k2y}
      const lift=L.on?Math.sin(Math.PI*Math.min(1,L.t))*s*0.25:0;
      c.lineWidth=Math.max(1,s*0.11);
      c.beginPath();c.moveTo(L.hx,L.hy);c.lineTo(kx,ky-lift*0.4);c.stroke();
      c.lineWidth=Math.max(0.8,s*0.07);
      c.beginPath();c.moveTo(kx,ky-lift*0.4);c.lineTo(L.fx,L.fy);c.stroke();
    }
    const [hx,hy]=this.dir(this.h);
    // abdomen
    c.save();c.translate(this.x-hx*s*0.7,this.y-hy*s*0.7);c.rotate(this.h);
    c.beginPath();c.ellipse(0,0,s*1.0,s*0.75,0,0,7);c.fill();
    c.restore();
    // head
    c.fillStyle=ink;
    c.beginPath();c.ellipse(this.x+hx*s*0.45,this.y+hy*s*0.45,s*0.5,s*0.42,this.h,0,7);c.fill();
  }
}

class Bat{
  constructor(x,y){
    this.x=x;this.y=y;this.base=rnd(14,30)*(W<600?0.6:1);this.born=performance.now();
    this.h=rnd(0,Math.PI*2);this.speed=rnd(120,200)*(W<600?0.65:1);this.wander=null;
    this.size=1;this.phase=rnd(0,6.28);this.flap=rnd(9,13);this.wob=rnd(0,6.28);this.vx=0;this.vy=0;this.bank=0;
  }
  update(dt,now){
    const age=(now-this.born)/1000,grow=Math.max(0,Math.min(1,age/0.4));
    this.size=this.base*(1-Math.pow(1-grow,3));
    if(!this.wander||Math.hypot(this.wander.x-this.x,this.wander.y-this.y)<60)this.wander={x:rnd(40,W-40),y:rnd(40,H-40)};
    const want=Math.atan2(this.wander.y-this.y,this.wander.x-this.x);
    this.wob+=dt*3;
    this.h+=ang(want-this.h)*Math.min(1,dt*1.8)+Math.sin(this.wob)*dt*1.6;
    const boost=1+3*Math.max(0,1-age/0.8);
    const sp=this.speed*boost*Math.min(1,grow*3);
    this.vx=Math.cos(this.h)*sp;this.vy=Math.sin(this.h)*sp;
    this.x+=this.vx*dt;this.y+=this.vy*dt;
    this.phase+=dt*this.flap*(1+0.5*Math.max(0,1-age/0.8));
    // lean into the direction of travel
    const lean=Math.cos(this.h)*0.35*Math.min(1,sp/this.speed);
    this.bank+=(lean-this.bank)*Math.min(1,dt*4);
  }
  draw(ink,c=ctx){
    const s=this.size;if(s<0.5)return;
    const S=s*2.4,th=0.85*Math.sin(this.phase),ct=Math.cos(th),st=Math.sin(th);
    c.save();c.translate(this.x,this.y-Math.sin(this.phase)*s*0.25);c.rotate(this.bank);c.fillStyle=ink;
    c.beginPath();
    for(let i=0;i<BAT.length;i++){
      let x=BAT[i][0],y=BAT[i][1];
      const w=Math.min(1,Math.max(0,(Math.abs(x)-0.2)/0.5));
      if(w>0){
        const sg=x<0?-1:1,px=0.18*sg,py=0.05,dx=x-px,dy=y-py;
        // wings swing toward / away from the viewer (rotation about the vertical axis) with perspective
        const z=Math.abs(dx)*st,pr=1/(1-0.4*z);
        x+=(px+dx*ct*pr-x)*w;y+=(py+dy*pr-y)*w;
      }
      if(i===0)c.moveTo(x*S,y*S);else c.lineTo(x*S,y*S);
    }
    c.closePath();c.fill();
    c.restore();
  }
}

function spawn(){
  const r=logo.getBoundingClientRect();
  const count=mode==='bat'?Math.floor(rnd(2,5)):Math.floor(rnd(4,8)); // bats: 2 to 4 per click, spiders: 4 to 7
  const start=spiders.length;
  const spread=rnd(0,Math.PI*2);
  for(let i=0;i<count;i++){
    const sx=r.left+r.width*rnd(.15,.85),sy=r.top+r.height*rnd(.35,.75);
    const sp=new (mode==='bat'?Bat:Spider)(sx,sy);
    // fan out evenly around the full circle, with a little jitter
    sp.h=spread+i*(Math.PI*2/count)+rnd(-.25,.25);
    const dist=rnd(300,600)*(W<600?0.6:1);
    sp.wander={x:Math.max(40,Math.min(W-40,sx+Math.cos(sp.h)*dist)),y:Math.max(40,Math.min(H-40,sy+Math.sin(sp.h)*dist))};
    sp.born=performance.now()+i*30+rnd(0,40);
    spiders.push(sp);
  }
  while(spiders.length>45)spiders.shift();
  // 3D perspective tilt: the logo heaves away from the direction the spider crawls out
  const h=rnd(0,Math.PI*2),ry=-Math.cos(h)*58,rx=Math.sin(h)*44;
  const T=(a,b,z,s)=>`perspective(450px) rotateX(${a}deg) rotateY(${b}deg) translateZ(${z}px) scale(${s})`;
  logo.animate([
    {transform:T(0,0,0,1),offset:0},
    {transform:T(rx,ry,120,1.05),offset:.18,easing:'ease-out'},
    {transform:T(-rx*.65,-ry*.65,-70,.95),offset:.45},
    {transform:T(rx*.3,ry*.3,40,1.02),offset:.68},
    {transform:T(-rx*.1,-ry*.1,0,1),offset:.86},
    {transform:T(0,0,0,1),offset:1}
  ],{duration:1300,easing:'cubic-bezier(.3,.7,.3,1)'});
}
logo.addEventListener('click',spawn);
document.getElementById('clear').onclick=()=>{spiders.length=0};

}));

const oc=document.getElementById('c2'),octx=oc.getContext('2d'),main=document.querySelector('main');
const maskUrl='url("'+logo.querySelector('img').src+'")';
oc.style.setProperty('-webkit-mask-image',maskUrl);oc.style.setProperty('mask-image',maskUrl);

// switch between spiders and bats
const modeBtn=document.getElementById('mode');
modeBtn.addEventListener('click',()=>{
  mode=mode==='spider'?'bat':'spider';
  modeBtn.textContent='Mode: '+(mode==='bat'?'Bats':'Spiders');
});

// PNG export (needs the viewer's downloads capability; button stays hidden without it)
let dl=null;
const exportBtn=document.getElementById('export');
if(window.claude&&claude.use){claude.use('downloads').then(d=>{if(d){dl=d;exportBtn.hidden=false}}).catch(()=>{})}
exportBtn.addEventListener('click',async()=>{
  if(!dl)return;
  const label=exportBtn.textContent;
  try{
    const cs=getComputedStyle(document.documentElement);
    const bgc=cs.getPropertyValue('--bg').trim()||'#ffffff',inkc=cs.getPropertyValue('--ink').trim()||'#000000';
    const sc=Math.min(Math.max(2,DPR),4096/Math.max(W,H));
    const ex=document.createElement('canvas');ex.width=Math.round(W*sc);ex.height=Math.round(H*sc);
    const c=ex.getContext('2d');c.scale(sc,sc);
    c.fillStyle=bgc;c.fillRect(0,0,W,H);
    for(const s of spiders)s.draw(inkc,c);
    const img=logo.querySelector('img');if(!img.complete)await img.decode();
    const mr=main.getBoundingClientRect(),lx=mr.left+logo.offsetLeft,ly=mr.top+logo.offsetTop,lw=logo.offsetWidth,lh=logo.offsetHeight;
    c.drawImage(img,lx,ly,lw,lh);
    // spiders over the logo are drawn in the background color, clipped to the logo shape
    const ov=document.createElement('canvas');ov.width=ex.width;ov.height=ex.height;
    const o=ov.getContext('2d');o.scale(sc,sc);
    for(const s of spiders)s.draw(bgc,o);
    o.globalCompositeOperation='destination-in';
    o.drawImage(img,lx,ly,lw,lh);
    c.drawImage(ov,0,0,W,H);
    const blob=await new Promise((res,rej)=>ex.toBlob(b=>b?res(b):rej(new Error('toBlob failed')),'image/png'));
    await dl.save({filename:'logo.png',data:blob});
  }catch(err){
    if(!err||err.code!=='declined'){exportBtn.textContent='Export failed';setTimeout(()=>{exportBtn.textContent=label},2000)}
  }
});

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  ctx.clearRect(0,0,W,H);
  const ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000';
  // overlay lives inside the logo and is masked to the logo shape: spiders turn white over it
  const mr=main.getBoundingClientRect(),lw=logo.offsetWidth,lh=logo.offsetHeight;
  if(oc.width!==Math.round(lw*DPR)||oc.height!==Math.round(lh*DPR)){oc.width=Math.round(lw*DPR);oc.height=Math.round(lh*DPR)}
  octx.setTransform(DPR,0,0,DPR,0,0);octx.clearRect(0,0,lw,lh);
  octx.translate(-(mr.left+logo.offsetLeft),-(mr.top+logo.offsetTop));
  const bgc=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#ffffff';
  for(const s of spiders){s.update(dt,now);s.draw(ink);s.draw(bgc,octx)}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
